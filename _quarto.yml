project:
  type: book
  output-dir: docs

book:
  title: "Spatial Python"
  subtitle: "A project-based course in spatial data science with Python"
  author: "Yousef Esmaeili"
  date: today

  description: |
    A hands-on, project-based course for learning spatial data science with Python,
    covering vector data, raster data, remote sensing, spatial analysis,
    suitability modeling, interactive maps, and Streamlit applications.

  favicon: images/logo.png

  chapters:
    - index.qmd

    - part: "Getting Started"
      chapters:
        - sessions/session-00-python-review.qmd

    - part: "Building the Project"
      chapters:
        - sessions/session-01-intro-loading-data.qmd
        - sessions/session-02-vector-data.qmd
        - sessions/session-03-raster-metadata-crs.qmd
        - sessions/session-04-ndvi.qmd
        - sessions/session-05-slope-aspect.qmd
        - sessions/session-06-buffers-distance.qmd
        - sessions/session-07-reprojection.qmd
        - sessions/session-08-suitability-model.qmd
        - sessions/session-09-interactive-map.qmd
        - sessions/session-10-streamlit-app.qmd

    - part: "Epilogue"
      chapters:
        - sessions/datasets.qmd
        - sessions/references.qmd

  page-footer:
    left: |
      Spatial Python by Yousef Esmaeili.
    right: |
      Built with <a href="https://quarto.org/">Quarto</a>.

  site-url: https://yousefess.github.io/spatial-python-course/
  repo-url: https://github.com/yousefess/spatial-python-course

  repo-actions:
    - edit
    - issue

  sharing:
    - linkedin

  page-navigation: true
  search: true

  sidebar:
    style: docked
    border: true

bibliography: sessions/references.bib

format:
  html:
    theme:
      light:
        - cosmo
        - theme-light.scss
      dark:
        - darkly
        - theme-dark.scss

    toc: true
    toc-depth: 3

    number-sections: false

    code-fold: false
    code-copy: true

    smooth-scroll: true

    highlight-style: github

    html-math-method: katex

    link-external-newwindow: true

editor: visual
